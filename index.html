    logW(S.profile.w);S.ui.ctx=primaryCtx().key;S.ui.tab='card';OB=null;draft=null;save();render(true);window.scrollTo(0,0);toast('Your card is ready');
  },
  exportData(){$('#bk').value=JSON.stringify(S);$('#bk').select()},
  copyBk(){const t=$('#bk');if(!t.value)t.value=JSON.stringify(S);t.select();const ok=()=>toast('Backup copied'),fb=()=>{try{document.execCommand('copy');ok()}catch(_){toast('Select the text and copy it')}};try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(e){fb()}},
  importData(){try{const o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!('profile' in o))throw 0;const d=defState();S=Object.assign(d,o,{life:Object.assign(d.life,o.life||{}),ui:Object.assign(d.ui,o.ui||{})});save();draft=null;render(true);toast('Backup restored')}catch(e){toast('That isn’t a valid backup code')}},
  reset(){const nm=S.profile?S.profile.name:'this player',id=PR.active;askDelete(nm,()=>{removeProfile(id,false);toast('Profile deleted')})},
  switcher(){openSheet(`<div class="sh-head"><h2>Profiles</h2></div><div class="sw-list">${PR.profiles.map(p=>`<button class="sw ${p.id===PR.active?'on':''}" onclick="App.useProfile('${p.id}')"><span class="sw-av" style="--c:${p.color}">${esc((p.name||'?').charAt(0).toUpperCase())}</span><span>${esc(p.name)}</span>${p.id===PR.active?'<span class="muted small">Current</span>':''}</button>`).join('')}</div><div class="btnrow" style="margin-top:14px"><button class="btn" onclick="App.tab('profile')">Edit my profile</button>${PR.profiles.length<8?`<button class="btn" onclick="App.addProfile()">${ico('plus')}Add profile</button>`:''}<button class="btn" onclick="App.showPicker(true)">Manage</button></div>`)},
  useProfile(id){if(id===PR.active&&!PICK){closeSheet();return}const p=PR.profiles.find(x=>x.id===id);if(!p)return;PR.active=id;saveRoot();S=loadP(id);PICK=false;MANAGE=false;draft=null;OB=null;closeSheet();
    if(S.profile){snapshot();save();render(true);window.scrollTo(0,0);toast(`Welcome back, <b>${esc(p.name)}</b>`)}else render(true)},
  addProfile(){closeSheet();PR.active=null;saveRoot();S=defState();PICK=false;MANAGE=false;draft=null;OB=null;render(true);window.scrollTo(0,0)},
  obCancel(){OB=null;draft=null;PICK=true;MANAGE=false;render(true)},
  showPicker(m){closeSheet();PICK=true;MANAGE=!!m;render(true);window.scrollTo(0,0)},
  manage(){MANAGE=!MANAGE;render(false)},
  delProfile(id){const p=PR.profiles.find(x=>x.id===id);if(!p)return;askDelete(p.name,()=>{removeProfile(id,true);toast(`${esc(p.name)}’s profile deleted`)})},
  confirmOk(){const f=PENDING;PENDING=null;closeSheet();if(f)f()}
};
function obRead(){
  const d=OB.d,g=id=>{const e=$('#'+id);return e?e.value:null};
  if(OB.step===0){d.name=(g('ob-name')||'').trim();d.dob=g('ob-dob')||'';d.sex=g('ob-sex')||'M'}
  if(OB.step===1){const m=d.units==='metric',num=x=>{const v=parseFloat(x);return isNaN(v)?'':v};
    d.h=m?(num(g('ob-cm'))||0)/2.54:(+g('ob-ft')||0)*12+(+g('ob-in')||0);
    const w=num(g('ob-w'));d.w=w===''?'':m?w/.4536:w;const wa=num(g('ob-waist'));d.waist=wa===''?'':m?wa/2.54:wa;d.bf=g('ob-bf')||''}
}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSheet();
  const a=document.activeElement;if(!a)return;
  if((e.key===' '||e.key==='Enter')&&a.id==='rt-pad'){e.preventDefault();rtTap()}
});
window.addEventListener('pagehide',save);
/* ============ SEASONAL TOUCHES ============ */
function season(){
  const t=new Date(),m=t.getMonth()+1,d=t.getDate();
  if(m===10)return{e:'🎃',p:['🦇','🍂','👻','🎃'],g:'Spooky season',c:'#f97316'};
  if(m===11)return{e:'🦃',p:['🍂','🍁','🍂'],g:'Thanksgiving season',c:'#c2410c'};
  if(m===12)return{e:'🎄',p:['❄️','❄️','✨','❄️'],g:'Happy holidays',c:'#16a34a'};
  if(m===1&&d<=7)return{e:'🎉',p:['🎉','✨','🎊'],g:'New year, new numbers',c:'#eab308'};
  if(m===2&&d>=7&&d<=14)return{e:'💘',p:['💗','💘','💕'],g:'Valentine’s week',c:'#ec4899'};
  if(m<=2)return{e:'❄️',p:['❄️','❄️'],g:'Winter training season',c:'#38bdf8'};
  if(m===3&&d>=10&&d<=17)return{e:'🍀',p:['🍀','☘️'],g:'St. Patrick’s week',c:'#22c55e'};
  if(m<=5)return{e:'🌸',p:['🌸','🌱'],g:'Spring season',c:'#f472b6'};
  if((m===6&&d>=28)||(m===7&&d<=5))return{e:'🎆',p:['🎆','✨','⭐'],g:'Happy Fourth of July',c:'#ef4444'};
  if(m<=8)return{e:'☀️',p:['☀️','🌴'],g:'Summer grind',c:'#f59e0b'};
  return{e:'🍂',p:['🍂','🍁'],g:'Fall camp season',c:'#d97706'};
}
let FEST=null,FEST_KEY=null;
/* Birthday: matches month and day; Feb 29 birthdays celebrate on Feb 28 in non-leap years. */
function isBday(dob){if(!dob)return false;const[,m,d]=dob.split('-').map(Number),t=new Date(),tm=t.getMonth()+1,td=t.getDate();
  if(m===2&&d===29){const leap=new Date(t.getFullYear(),1,29).getMonth()===1;return tm===2&&td===(leap?29:28)}return tm===m&&td===d}
function burst(){if(REDUCE)return;const b=document.createElement('div');b.className='burst';b.setAttribute('aria-hidden','true');const em=['🎉','🎊','🎈','✨','🎂'];let s='';
  for(let i=0;i<24;i++){const a=Math.random()*Math.PI*2,r=110+Math.random()*170;s+=`<span style="--x:${(Math.cos(a)*r).toFixed(0)}px;--y:${(Math.sin(a)*r-90).toFixed(0)}px;animation-delay:${(Math.random()*.15).toFixed(2)}s">${em[i%em.length]}</span>`}
  b.innerHTML=s;document.body.appendChild(b);setTimeout(()=>b.remove(),1900)}
/* Shown once per birthday per profile: greeting plus how the older age group changes the same numbers. */
function maybeBday(){
  if(PICK||!S.profile||!isBday(S.profile.dob))return;const yr=new Date().getFullYear();if(S.bday===yr)return;S.bday=yr;save();
  const P=S.profile,ctx=primaryCtx(),now=rate(ctx),age=Math.floor(ageOf(P.dob)+.01);let prev=null;
  if(now.ready){const keep=P.dob,[y0,m0,d0]=keep.split('-').map(Number);P.dob=`${y0+1}-${z2(m0)}-${z2(d0)}`;try{prev=rate(ctx).ovr}finally{P.dob=keep}}
  let recap='';
  if(now.ready&&prev!=null&&prev!==now.ovr)recap=`<div class="bday-recap"><div><span>At ${age-1}</span><b class="num">${prev}</b></div><span class="arrow">→</span><div><span>At ${age}</span><b class="num">${now.ovr}</b></div></div><p class="small muted">${now.ovr<prev?'Same numbers, tougher standards: you’re now compared with older athletes. Beat your old tests to climb back.':'Same numbers, and the standards for your age give you a little more room this year.'}</p>`;
  else if(now.ready)recap=`<p class="small muted">Your ${esc(ctx.abbr)} rating holds at <b>${now.ovr}</b> for the new year.</p>`;
  openSheet(`<div class="bday"><div class="bday-cake" aria-hidden="true">🎂</div><h2>Happy birthday, ${esc(P.name)}!</h2><p>You’re ${age} today.</p>${recap}<p class="small">Today’s bonus challenge: set a birthday PR for +50 XP.</p><button class="btn primary block" onclick="App.closeSheet()">Let’s go</button></div>`);
  setTimeout(burst,250);
}
function applyFest(){
  const bd=!!(S.profile&&!PICK&&isBday(S.profile.dob));
  const nf=bd?{e:'🎂',p:['🎉','🎈','🎂','✨','🎊'],g:`Happy birthday, ${esc(S.profile.name)}!`,c:'#ec4899',bday:true}:PR.festive!==false?season():null;
  const fk=nf?nf.e+nf.g:'none';if(fk===FEST_KEY)return;FEST_KEY=fk;FEST=nf;
  document.body.classList.toggle('festive',!!FEST);
  const old=document.getElementById('fx');if(old)old.remove();
  const mk=document.querySelector('.logo .mark'),ob=mk&&mk.querySelector('.fest-badge');if(ob)ob.remove();
  if(!FEST)return;
  document.body.style.setProperty('--fest',FEST.c);
  if(mk)mk.insertAdjacentHTML('beforeend',`<span class="fest-badge" aria-hidden="true">${FEST.e}</span>`);
  if(REDUCE)return;
  const fx=document.createElement('div');fx.id='fx';fx.setAttribute('aria-hidden','true');
  let s='';for(let i=0;i<9;i++)s+=`<span style="left:${(i*11+Math.random()*8).toFixed(1)}%;animation-delay:${(-Math.random()*20).toFixed(1)}s;animation-duration:${(16+Math.random()*10).toFixed(1)}s;font-size:${Math.round(12+Math.random()*10)}px">${FEST.p[i%FEST.p.length]}</span>`;
  fx.innerHTML=s;document.body.prepend(fx);
}
App.fest=function(){PR.festive=PR.festive===false;saveRoot();applyFest();render(false);toast(PR.festive?'Decorations on':'Decorations off')};
/* Clock: re-check the date every 20 seconds and whenever the app comes back to the screen, so the day, season and
   birthday all switch at midnight even if the app was left open. Waits if you're mid-typing. */
let LAST_DAY=today();
function clockTick(){const d=today();if(d===LAST_DAY)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;LAST_DAY=d;render(false)}
setInterval(clockTick,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)clockTick()});
/* ============ CLOUD SAVE ============
   Each person's profiles are mirrored to their own private space in this app's database (nobody else, the app's
   owner included, can read it), so data follows them to any device where they open the app signed in.
   This device's storage stays the working copy; for each profile the most recently changed copy wins. */
var CLOUD={col:null,state:'off',last:0,dirty:new Set(),root:false,t:null,busy:false};
function cloudMark(id){if(!CLOUD||!CLOUD.col)return;if(id)CLOUD.dirty.add(id);CLOUD.root=true;clearTimeout(CLOUD.t);CLOUD.t=setTimeout(cloudPush,2500)}
function cloudJson(raw){if(raw.length<=200000)return raw;const o=JSON.parse(raw);const k=Object.keys(o.daily||{}).sort();k.slice(0,Math.max(0,k.length-90)).forEach(x=>delete o.daily[x]);o.history=(o.history||[]).slice(-400);o.weights=(o.weights||[]).slice(-400);o.meal={};return JSON.stringify(o)}
async function cloudPush(){
  if(!CLOUD.col)return;if(CLOUD.busy){clearTimeout(CLOUD.t);CLOUD.t=setTimeout(cloudPush,1500);return}
  CLOUD.busy=true;setCloud('saving');
  try{
    for(const id of [...CLOUD.dirty]){CLOUD.dirty.delete(id);const ent=PR.profiles.find(p=>p.id===id),raw=localStorage.getItem(pkey(id));if(!ent||!raw)continue;
      await CLOUD.col.doc('p_'+id).set({json:cloudJson(raw),updated:ent.updated||0})}
    if(CLOUD.root){CLOUD.root=false;await CLOUD.col.doc('root').set({json:JSON.stringify({profiles:PR.profiles,deleted:PR.deleted||[],festive:PR.festive}),updated:Date.now()})}
    CLOUD.last=Date.now();setCloud('on');
  }catch(e){setCloud('error')}finally{CLOUD.busy=false}
}
function timeAgo(t){const s=(Date.now()-t)/1000;return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}
function cloudLabel(){return{off:'Off here. Cloud save turns on when you open this app signed in to Claude.',loading:'Connecting…',saving:'Saving…',on:`On. Synced ${CLOUD.last?timeAgo(CLOUD.last):'just now'}. Your profiles follow you to any device.`,error:'Couldn’t reach the cloud just now. Everything is safe on this device and will sync next time.'}[CLOUD.state]}
function setCloud(st){CLOUD.state=st;const el=document.getElementById('cloud-st');if(el)el.textContent=cloudLabel()}
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function'){setCloud('off');return}
    setCloud('loading');
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setCloud('off');return}
    const uid=await user.id();if(!uid){setCloud('off');return}
    const col=db.collection('data/users/'+uid);
    const rs=await col.doc('root').get();let changed=false;
    if(rs.exists){
      const cr=JSON.parse((rs.data()||{}).json||'{}'),cps=cr.profiles||[];
      const del=new Set([...(cr.deleted||[]),...(PR.deleted||[])]);PR.deleted=[...del].slice(-50);
      PR.profiles=PR.profiles.filter(p=>!del.has(p.id));
      for(const cp of cps){if(del.has(cp.id))continue;const lp=PR.profiles.find(p=>p.id===cp.id);
        if(!lp||(cp.updated||0)>(lp.updated||0)){const d=await col.doc('p_'+cp.id).get();
          if(d.exists){localStorage.setItem(pkey(cp.id),(d.data()||{}).json);if(lp)Object.assign(lp,{name:cp.name,color:cp.color,updated:cp.updated});else PR.profiles.push({id:cp.id,name:cp.name,color:cp.color,updated:cp.updated});changed=true}}
        else if((lp.updated||0)>(cp.updated||0))CLOUD.dirty.add(lp.id)}
      PR.profiles.forEach(p=>{if(!cps.some(c=>c.id===p.id))CLOUD.dirty.add(p.id)});
      for(const c of cps)if(del.has(c.id))col.doc('p_'+c.id).delete().catch(()=>{});
      if(PR.festive===undefined&&cr.festive===false){PR.festive=false;FEST_KEY=null;changed=true}
    }else PR.profiles.forEach(p=>CLOUD.dirty.add(p.id));
    CLOUD.col=col;CLOUD.root=true;
    if(PR.active&&!PR.profiles.some(p=>p.id===PR.active))PR.active=null;
    saveRootRaw();
    if(changed){
      if(OB&&(OB.step>0||OB.d.name)){toast('Found your saved profiles ☁️ Tap Cancel to see them.')}
      else if(OB){OB=null;draft=null;S=defState();PICK=PR.profiles.length>0;FEST_KEY=null;render(true);toast('Synced your cloud save ☁️')}
      else{S=PR.active?loadP(PR.active):defState();draft=null;PICK=PR.profiles.length>1||(PR.profiles.length>0&&!PR.active);FEST_KEY=null;closeSheet();render(true);toast('Synced your cloud save ☁️')}
    }
    setCloud('on');cloudPush();
  }catch(e){setCloud('error')}
  finally{BOOTING=false}
}
let PICK=PR.profiles.length>1||(PR.profiles.length>0&&!PR.active),MANAGE=false;
if(S.profile&&!PICK){snapshot();save()}
/* Android back button (Capacitor App plugin): close a panel first, then step back, then exit. */
try{const CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(CapApp)CapApp.addListener('backButton',()=>{
    if($('#sheet-root').classList.contains('open')){closeSheet();return}
    if(!S.profile&&OB&&OB.step>0){App.obBack();return}
    if(!PICK&&S.profile&&S.ui.tab!=='card'){App.tab('card');return}
    CapApp.exitApp()})}catch(e){}
/* ============ INSTALL TO HOME SCREEN ============
   Android/Chrome offers a real install prompt; iPhone needs Share > Add to Home Screen, so it gets instructions. */
let DEFER_PROMPT=null;
const IS_STANDALONE=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const IS_MOBILE=IS_IOS||/android/i.test(navigator.userAgent);
function installDismissed(){try{return localStorage.getItem('trueovr.install')==='1'}catch(e){return false}}
function showInstall(force){
  if(IS_STANDALONE()||(!force&&installDismissed())||!(IS_MOBILE||DEFER_PROMPT||force))return;
  let el=document.getElementById('install');if(!el){el=document.createElement('div');el.id='install';el.setAttribute('role','dialog');el.setAttribute('aria-label','Install True OVR');document.body.appendChild(el)}
  const msg=DEFER_PROMPT?'Put it on your home screen. Works offline, full screen.'
    :IS_IOS?'In Safari, tap Share <span class="in-share" aria-hidden="true">↑</span> then “Add to Home Screen.” Install before adding data, because the home-screen app keeps its own storage.'
    :'Open your browser menu ⋮ and tap “Install app” or “Add to Home screen.”';
  el.innerHTML=`<div class="in-ic" aria-hidden="true">OVR</div><div class="in-t"><b>Install True OVR</b><span>${msg}</span></div>${DEFER_PROMPT?'<button class="btn primary sm" onclick="App.install()">Install</button>':''}<button class="in-x" aria-label="Dismiss" onclick="App.hideInstall()">${ico('x')}</button>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('show')));
}
function hideInstall(){const el=document.getElementById('install');if(el)el.classList.remove('show');try{localStorage.setItem('trueovr.install','1')}catch(e){}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER_PROMPT=e;showInstall()});
window.addEventListener('appinstalled',hideInstall);
App.install=async()=>{if(!DEFER_PROMPT)return;DEFER_PROMPT.prompt();try{await DEFER_PROMPT.userChoice}catch(e){}DEFER_PROMPT=null;hideInstall()};
App.hideInstall=hideInstall;
App.installHelp=()=>showInstall(true);
setTimeout(showInstall,1500);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render(true);
cloudInit();
setTimeout(()=>{BOOTING=false},12000);
</script>
